set -g @mode_bg '#{?client_prefix,#ffff55,#{?pane_in_mode,#ff55ff,#5555ff}}'

set -g status-style 'fg=#ffffff,bg=#121212'
set -g status-left-length 32
set -g status-right-length 64
set -g status-left '#[fg=#000000,bg=#{E:@mode_bg}] #S '
set -g status-right "#[fg=#ffffff,bg=#1e1e1e] #{=/-48/<;s|^$HOME|~|:pane_current_path} #[fg=#000000,bg=#{E:@mode_bg}] %H:%M "

set -g window-status-separator ''
set -g window-status-style 'fg=#888888,bg=#121212'
set -g window-status-current-style 'fg=#ffffff,bg=#121212'
set -g window-status-bell-style 'fg=#ffff55,bg=#121212'
set -g window-status-activity-style 'fg=#ffff55,bg=#121212'
set -g window-status-format ' #I:#W#{?window_zoomed_flag,+,} '
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag,+,} '

set -g message-style 'fg=#ffffff,bg=#000000'
set -g message-command-style 'fg=#ffffff,bg=#000000'
set -g mode-style 'fg=#000000,bg=#b5d5ff'
set -g pane-border-style 'fg=#1e1e1e'
set -g pane-active-border-style 'fg=#545454'
