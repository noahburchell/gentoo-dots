set -g @mode_bg '#{?client_prefix,#aa5500,#{?pane_in_mode,#aa00aa,#0000aa}}'

set -g status-style 'fg=#000000,bg=#555555'
set -g status-left-length 32
set -g status-right-length 64
set -g status-left '#[fg=#ffffff,bg=#{E:@mode_bg}] #S '
set -g status-right "#[fg=#ffffff,bg=#555555] #{=/-48/<;s|^$HOME|~|:pane_current_path} #[bg=#{E:@mode_bg}] %H:%M "

set -g window-status-separator ''
set -g window-status-style 'fg=#aaaaaa,bg=#555555'
set -g window-status-current-style 'fg=#ffffff,bg=#555555'
set -g window-status-bell-style 'fg=#ffff55,bg=#555555'
set -g window-status-activity-style 'fg=#ffff55,bg=#555555'
set -g window-status-format ' #I:#W#{?window_zoomed_flag,+,} '
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag,+,} '

set -g message-style 'fg=#aaaaaa,bg=#000000'
set -g message-command-style 'fg=#aaaaaa,bg=#000000'
