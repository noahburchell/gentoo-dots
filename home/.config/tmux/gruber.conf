set -g @mode_bg '#{?client_prefix,#ffdd33,#{?pane_in_mode,#9e95c7,#96a6c8}}'

set -g status-style 'fg=#e4e4ef,bg=#282828'
set -g status-left-length 32
set -g status-right-length 64
set -g status-left '#[fg=#181818,bg=#{E:@mode_bg}] #S '
set -g status-right "#[fg=#e4e4ef,bg=#453d41] #{=/-48/<;s|^$HOME|~|:pane_current_path} #[fg=#181818,bg=#{E:@mode_bg}] %H:%M "

set -g window-status-separator ''
set -g window-status-style 'fg=#95a99f,bg=#282828'
set -g window-status-current-style 'fg=#ffffff,bg=#282828'
set -g window-status-bell-style 'fg=#ffdd33,bg=#282828'
set -g window-status-activity-style 'fg=#ffdd33,bg=#282828'
set -g window-status-format ' #I:#W#{?window_zoomed_flag,+,} '
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag,+,} '

set -g message-style 'fg=#e4e4ef,bg=#181818'
set -g message-command-style 'fg=#e4e4ef,bg=#181818'
set -g mode-style 'fg=#ffffff,bg=#484848'
set -g pane-border-style 'fg=#282828'
set -g pane-active-border-style 'fg=#52494e'
