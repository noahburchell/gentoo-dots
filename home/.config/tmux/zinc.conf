set -g @mode_bg '#{?client_prefix,#f59e0b,#{?pane_in_mode,#d946ef,#3b82f6}}'

set -g status-style 'fg=#d4d4d8,bg=#18181b'
set -g status-left-length 32
set -g status-right-length 64
set -g status-left '#[fg=#101013,bg=#{E:@mode_bg}] #S '
set -g status-right "#[fg=#d4d4d8,bg=#27272a] #{=/-48/<;s|^$HOME|~|:pane_current_path} #[fg=#101013,bg=#{E:@mode_bg}] %H:%M "

set -g window-status-separator ''
set -g window-status-style 'fg=#71717a,bg=#18181b'
set -g window-status-current-style 'fg=#fafafa,bg=#18181b'
set -g window-status-bell-style 'fg=#facc15,bg=#18181b'
set -g window-status-activity-style 'fg=#facc15,bg=#18181b'
set -g window-status-format ' #I:#W#{?window_zoomed_flag,+,} '
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag,+,} '

set -g message-style 'fg=#d4d4d8,bg=#101013'
set -g message-command-style 'fg=#d4d4d8,bg=#101013'
set -g mode-style 'fg=#fafafa,bg=#3f3f46'
set -g pane-border-style 'fg=#27272a'
set -g pane-active-border-style 'fg=#52525b'
