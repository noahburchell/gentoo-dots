set -g @mode_bg '#{?client_prefix,#cca700,#{?pane_in_mode,#bc3fbc,#2472c8}}'

set -g status-style 'fg=#cccccc,bg=#1f1f1f'
set -g status-left-length 32
set -g status-right-length 64
set -g status-left '#[fg=#181818,bg=#{E:@mode_bg}] #S '
set -g status-right "#[fg=#cccccc,bg=#2b2b2b] #{=/-48/<;s|^$HOME|~|:pane_current_path} #[fg=#181818,bg=#{E:@mode_bg}] %H:%M "

set -g window-status-separator ''
set -g window-status-style 'fg=#808080,bg=#1f1f1f'
set -g window-status-current-style 'fg=#ffffff,bg=#1f1f1f'
set -g window-status-bell-style 'fg=#f5f543,bg=#1f1f1f'
set -g window-status-activity-style 'fg=#f5f543,bg=#1f1f1f'
set -g window-status-format ' #I:#W#{?window_zoomed_flag,+,} '
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag,+,} '

set -g message-style 'fg=#cccccc,bg=#181818'
set -g message-command-style 'fg=#cccccc,bg=#181818'
set -g mode-style 'fg=#ffffff,bg=#3a3d41'
set -g pane-border-style 'fg=#2b2b2b'
set -g pane-active-border-style 'fg=#6e7681'
