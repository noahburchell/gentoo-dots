set -g @mode_bg '#{?client_prefix,#ff9f0a,#{?pane_in_mode,#bf5af2,#0a84ff}}'

set -g status-style 'fg=#dfdfdf,bg=#282828'
set -g status-left-length 32
set -g status-right-length 64
set -g status-left '#[fg=#1e1e1e,bg=#{E:@mode_bg}] #S '
set -g status-right "#[fg=#dfdfdf,bg=#323232] #{=/-48/<;s|^$HOME|~|:pane_current_path} #[fg=#1e1e1e,bg=#{E:@mode_bg}] %H:%M "

set -g window-status-separator ''
set -g window-status-style 'fg=#8e8e93,bg=#282828'
set -g window-status-current-style 'fg=#ffffff,bg=#282828'
set -g window-status-bell-style 'fg=#ffd60a,bg=#282828'
set -g window-status-activity-style 'fg=#ffd60a,bg=#282828'
set -g window-status-format ' #I:#W#{?window_zoomed_flag,+,} '
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag,+,} '

set -g message-style 'fg=#dfdfdf,bg=#1e1e1e'
set -g message-command-style 'fg=#dfdfdf,bg=#1e1e1e'
set -g mode-style 'fg=#ffffff,bg=#3f638b'
set -g pane-border-style 'fg=#323232'
set -g pane-active-border-style 'fg=#636366'
