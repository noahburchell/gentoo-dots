OPT="-O3 -march=native -mtune=native -pipe \
     -flto=auto -fuse-linker-plugin -fno-fat-lto-objects \
     -fipa-pta -fdevirtualize-at-ltrans -fno-semantic-interposition \
     -fgraphite-identity -floop-nest-optimize \
     -ffast-math -fno-math-errno -fallow-store-data-races \
     -funroll-loops -fomit-frame-pointer -momit-leaf-frame-pointer \
     -ffunction-sections -fdata-sections \
     -fno-plt"
UNSAFE="-fno-stack-protector \
        -fno-stack-clash-protection \
        -fcf-protection=none \
        -fno-pie \
        -ftrivial-auto-var-init=uninitialized \
        -fzero-call-used-regs=skip \
        -mindirect-branch=keep -mfunction-return=keep \
        -fno-asynchronous-unwind-tables -fno-unwind-tables"
COMMON_FLAGS="${OPT} ${UNSAFE}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
CPPFLAGS="-U_FORTIFY_SOURCE -U_GLIBCXX_ASSERTIONS -DNDEBUG"
LDFLAGS="${COMMON_FLAGS} \
         -no-pie \
         -Wl,-O2 -Wl,--as-needed -Wl,--gc-sections \
         -Wl,--hash-style=gnu -Wl,--sort-common \
         -Wl,-z,norelro -Wl,-z,lazy \
         -Wl,-z,execstack"
FEATURES="-test"
