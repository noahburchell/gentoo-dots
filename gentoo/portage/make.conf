WARNING_FLAGS="-Werror=odr -Werror=lto-type-mismatch -Werror=strict-aliasing"
COMMON_FLAGS="-march=native -fno-plt -O2 -pipe -fno-semantic-interposition -flto=auto ${WARNING_FLAGS}"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

LDFLAGS="${COMMON_FLAGS} -Wl,-O2 -Wl,--as-needed -Wl,--hash-style=gnu -Wl,-z,pack-relative-relocs"
LDFLAGS="${LDFLAGS} -fuse-ld=mold"

RUSTFLAGS="-C target-cpu=native -C opt-level=3"
RUSTFLAGS="${RUSTFLAGS} -C strip=debuginfo"
RUSTFLAGS="${RUSTFLAGS} -C link-arg=-fuse-ld=mold"

MAKEOPTS="-j12 -l12"

LC_MESSAGES=C.UTF-8
VIDEO_CARDS="amdgpu radeonsi"
L10N="en"
ACCEPT_LICENSE="-* @FREE"

EMERGE_DEFAULT_OPTS="--autounmask --ask --verbose --keep-going --backtrack=100 --verbose-conflicts --with-bdeps=y"

BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="-T0 -3"
PORTAGE_COMPRESS="zstd"
PORTAGE_COMPRESS_FLAGS="-q --rm -9 -T0"

FEATURES="${FEATURES} candy parallel-install parallel-fetch buildpkg"
QEMU_SOFTMMU_TARGETS="x86_64"
QEMU_USER_TARGETS=""
NINIT_TEST_KERNEL="/var/lib/ninit/test-kernels/vmlinuz-7.2.8-nixos"

ACCT_USER_PORTAGE_GROUPS_ADD="kvm"

CPU_FLAGS_X86="aes avx avx2 avx512_bf16 avx512_bitalg avx512_vbmi2 avx512_vnni avx512_vp2intersect avx512_vpopcntdq avx512bw avx512cd avx512dq avx512f avx512ifma avx512vbmi avx512vl avx_vnni bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"

USE="-telemetry -debug -X -nls -handbook -examples -debuginfod -vala -gdbm"
USE="${USE} -gtk -sdl -cups -bluetooth -branding -xv"
USE="${USE} vaapi heif ffmpeg lto pgo jit orc threads zstd"
USE="${USE} wayland vulkan pulseaudio dbus"

PORTAGE_LOGDIR="/var/log/portage"

INSTALL_MASK="/usr/share/locale -/usr/share/locale/locale.alias"
INSTALL_MASK="${INSTALL_MASK} /usr/share/bash-completion /etc/bash_completion.d"
