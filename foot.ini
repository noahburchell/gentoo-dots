[main]
font=Bm437 IBM VGA 8x16:pixelsize=16, Cascadia Code:pixelsize=16
dpi-aware=no
pad=5x5
initial-window-size-chars=150x40
bold-text-in-bright=palette-based

[csd]
preferred=server

[scrollback]
lines=10000

[cursor]
style=underline
blink=yes

# linux console palette from drivers/tty/vt/vt.c
# (default_red / default_grn / default_blu)
[colors]
cursor=000000 aaaaaa
foreground=aaaaaa
background=000000
regular0=000000
regular1=aa0000
regular2=00aa00
regular3=aa5500
regular4=0000aa
regular5=aa00aa
regular6=00aaaa
regular7=aaaaaa
bright0=555555
bright1=ff5555
bright2=55ff55
bright3=ffff55
bright4=5555ff
bright5=ff55ff
bright6=55ffff
bright7=ffffff
selection-foreground=000000
selection-background=aaaaaa
